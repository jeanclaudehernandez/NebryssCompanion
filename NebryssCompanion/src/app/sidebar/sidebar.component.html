<div #burger class="burger-menu" (click)="toggleMenu()">☰</div>

<nav #sidebar class="sidebar" [class.open]="isOpen">
  <div class="menu-content">
    <div class="menu-item" (click)="changeView('items')">Items</div>
    <div class="menu-item" (click)="changeView('bestiary')">Bestiary</div>
    <div class="menu-item" (click)="changeView('terrains')">Terrains</div>
    <div class="menu-item" (click)="changeView('mistEffects')">Mist Effects</div>
    <div class="menu-item" (click)="changeView('weaponRules')">Weapon Rules</div>
    <div class="menu-item" (click)="changeView('alteredStates')">Altered States</div>
    <div class="menu-item" (click)="changeView('afflictions')">Afflictions</div>
    <div class="menu-item" (click)="changeView('shipNavigation')">Ship Navigation</div>
    <div class="menu-item" (click)="changeView('lore')">Lore</div>
    <div class="menu-item" (click)="changeView('locations')">Locations</div>
    <div class="menu-item" (click)="openAdminItemCreator()">Admin Item Creator</div>
    
    <div class="update-section">
      <button class="update-button clean-storage" (click)="clearStorageAndUpdate()">Refresh</button>
      <button *ngIf="!isAdmin" class="update-button admin-btn" (click)="openAdminDialog(adminDialog)">Admin Access</button>
      <button *ngIf="isAdmin" class="update-button admin-btn" (click)="logoutAdmin()">Logout Admin</button>
    </div>
  </div>
</nav>

<ng-template #confirmDialog let-confirm="confirm" let-cancel="cancel">
  <div class="confirmation-dialog">
    <h3>Warning</h3>
    <p>This will clear all locally stored changes. Make sure you have saved your characters before proceeding.</p>
    <div class="dialog-buttons">
      <button class="btn-cancel" (click)="cancel()">Cancel</button>
      <button class="btn-confirm" (click)="confirm()">Continue</button>
    </div>
  </div>
</ng-template>

<ng-template #adminDialog let-check="check" let-cancel="cancel">
  <div class="confirmation-dialog">
    <h3>Admin Access</h3>
    <p>Enter admin password:</p>
    <input #passwordInput type="password" style="margin-bottom: 10px; padding: 5px; width: 100%; box-sizing: border-box;" (keyup.enter)="check(passwordInput.value)">
    <div class="dialog-buttons">
      <button class="btn-cancel" (click)="cancel()">Cancel</button>
      <button class="btn-confirm" (click)="check(passwordInput.value)">Submit</button>
    </div>
  </div>
</ng-template>

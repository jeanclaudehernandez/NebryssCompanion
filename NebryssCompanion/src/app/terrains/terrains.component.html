<div class="terrains-container">
  <div class="terrain-list">
    <div *ngFor="let terrain of terrains" class="terrain-card" [id]="'terrain-' + terrain.id">
      <h2 class="terrain-name">{{ terrain.name }}</h2>
      
      <div class="terrain-content">
        <div class="terrain-image">
          <app-image-viewer 
            [imageUrl]="terrain.imageUrl" 
            previewMode="full"
            [altText]="terrain.name">
          </app-image-viewer>
        </div>
        
        <div class="terrain-description">
          <p>{{ terrain.description }}</p>
        </div>
      </div>
    </div>
  </div>
  
  <app-scroll-nav [sections]="scrollSections"></app-scroll-nav>
</div>

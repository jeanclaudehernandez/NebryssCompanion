services:
  mongodb:
    image: mongo:latest
    container_name: nebryss-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - nebryss_mongodb_data:/data/db

volumes:
  nebryss_mongodb_data:
    # Use the existing data volume as-is (without this, Compose would prefix it with the
    # project name and start the database on a new, empty volume).
    name: nebryss_mongodb_data

